name: alkhair_app
description: Al-Khair — surplus food donation management app (University of Bisha graduation project).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cloud_firestore: ^5.6.9
  cloud_functions: ^5.2.6
  firebase_app_check: ^0.3.2+6
  firebase_auth: ^5.5.4
  firebase_core: ^3.14.0
  firebase_crashlytics: ^4.3.10
  firebase_messaging: ^15.2.6
  fl_chart: ^0.70.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  fpdart: ^1.1.0
  freezed_annotation: ^2.4.4
  geolocator: ^13.0.2
  go_router: ^14.6.3
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.10.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  pdf: ^3.11.1
  printing: ^5.14.2
  riverpod_annotation: ^2.6.1
  url_launcher: ^6.3.1

dev_dependencies:
  build_runner: ^2.4.14
  flutter_test:
    sdk: flutter
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  mocktail: ^1.0.4
  riverpod_generator: ^2.6.3
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/images/
